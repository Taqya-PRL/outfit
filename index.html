<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日の出社コーデ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#2b2b28; --sub:#6f6f69; --line:#e3e1dc; --tint:#eef3f7; --accent:#3b6a8f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#191919; --fg:#ececea; --sub:#a0a09a; --line:#333330; --tint:#232a30; --accent:#8fb8d6; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--fg);padding:20px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto}
.head{background:var(--tint);border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;transition:background .4s}
.temp{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.temp small{font-size:20px;font-weight:400;margin-left:2px}
.meta{font-size:14px;color:var(--sub);flex:1;min-width:200px}
.meta b{color:var(--fg);font-weight:700}
.alert{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--accent);font-size:14px}
.list{display:grid;gap:12px;margin-top:16px}
.item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.fig svg{width:200px;height:auto;display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.wx{display:flex;gap:14px;margin-left:auto}
.wx div{text-align:center;font-size:12px;color:var(--sub)}
.wx svg{width:44px;height:44px;display:block;margin:0 auto 2px}
.item h2{margin:0 0 6px;font-size:16px}
.item p{margin:0;font-size:14px;color:var(--sub)}
.item ul{margin:0 0 6px;padding-left:1.1em;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.parts{list-style:none;padding:0;margin:0}
.parts li{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px}
.parts i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.date .sub{font-size:12px;font-weight:400;color:var(--sub);margin-left:6px}
.date{font-size:16px;font-weight:700;margin:0 0 8px 2px;letter-spacing:.02em}
.foot{margin-top:14px;font-size:12px;color:var(--sub)}
.err{padding:16px;border:1px solid var(--line);border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">天気を取得しています…</div></div>

<script>
// 場所は URL で変更可能: outfit.html?lat=35.68&lon=139.76&name=東京
const q = new URLSearchParams(location.search);
const LAT = q.get("lat") || "35.7996";
const LON = q.get("lon") || "139.4687";
const NAME = q.get("name") || "所沢";
const GO = +(q.get("go") || 8);   // 出社時刻
const BACK = +(q.get("back") || 19); // 退勤時刻

// 気温帯(体感温度)
const TIERS = [
  { min: 28, label: "とても暑い", tint: ["#fdeee6","#3a2a22"] },
  { min: 23, label: "暑め", tint: ["#fdf3e3","#38301f"] },
  { min: 18, label: "快適", tint: ["#eef5ec","#232f22"] },
  { min: 13, label: "やや肌寒い", tint: ["#eef3f7","#232a30"] },
  { min: 8, label: "寒い", tint: ["#e9eef6","#222833"] },
  { min: -99, label: "かなり寒い", tint: ["#e6e9f3","#212535"] }
];

// ===== 手持ちの服(表記: アイテム(色)) =====
// 柄: CHK=チェック STR=ストライプ GEO=幾何柄(小紋)
// 色: BRW=ブラウン NVY=ネイビー BLK=ブラック GRY=グレー BGE=ベージュ CML=キャメル OLV=オリーブ GRN=グリーン WHT=ホワイト IDG=インディゴ
//     DRK=ダーク LGT=ライト PAL=ペール DEP=ディープ / CHK=チェック STR=ストライプ
const P = {BRW:"#6b4a35","DRK-BRW":"#4a3226",NVY:"#1f2f4f","DRK-NVY":"#17213a",BLK:"#1c1c1c",GRY:"#7d8087","LGT-GRY":"#b9bcc1","DRK-GRY":"#4a4c50",BGE:"#cdb89a",CML:"#b08d5b",OLV:"#6b6b3f",GRN:"#3f6b4f",WHT:"#f7f7f5","OFF-WHT":"#ece6d8","DEP-IDG":"#2e3d5e","PAL-IDG":"#8fa6c4"};
// 季節 → 体感温度の範囲(季節の文字列 or [下限,上限])
const SUMMER = 24; // 体感がこれ以上の日はネクタイなし
const SEASON = {"春":[14,24],"夏":[24,99],"秋":[10,22],"冬":[-99,12]};
function rg(x) {
  const v = x[2]; if (typeof v !== "string") return v;
  const r = [...v].map(c => SEASON[c]);
  return [Math.min(...r.map(a => a[0])), Math.max(...r.map(a => a[1]))];
}
const d = (n, c, note) => n + "(" + c + ")" + (note || "");

const SUIT = ["スリーピーススーツ", "BRW"];
const SETUPS = [ // 名前, 色, 季節, 色味, アンクル丈
  ["コーデュロイセットアップ","DRK-BRW","秋冬","brown",1],
  ["感動セットアップ","NVY","春夏","navy",1],
  ["感動セットアップ","BLK","春夏","black",1] ];
const JACKETS = [ // 名前, 色, 季節, 色味
  ["ジャケット","NVY","春秋冬","navy"],
  ["ジャケット","BRW","秋冬","brown"] ];
const PANTS = [ // 名前, 色, 季節, 対象, 合わせないジャケット色, アンクル丈
  ["感動パンツ","GRY","春夏秋","ABC","",0],
  ["感動パンツ","BGE","春夏秋","ABC","",0],
  ["チノ","GRY","春秋冬","ABC","",0],
  ["チノ","NVY","春秋冬","ABC","navy",0],
  ["チノ","BGE","春秋冬","ABC","",0],
  ["チノ","NVY/GRY-CHK","春夏秋","BC","",1],
  ["チノ","OLV","春夏秋","BC","",1],
  ["ジーンズ","BLK","春秋冬","C","brown navy",0],
  ["ジーンズ","DRK-NVY","春秋","C","navy",1] ]
  .concat(SETUPS.map(s => [s[0] + "・パンツ", s[1], s[2], "ABC", s[3] === "navy" ? "navy" : s[3] === "black" ? "brown navy" : "brown", 1]));
const TOPS = [ // 名前, 色, 範囲, 対象, ドレスシャツ, 首が詰まった形, ジャケットと合わせ不可(厚手)
  ["シャツ","WHT",[-99,99],"ABC",1,0],
  ["シャツ","DEP-IDG",[8,27],"ABC",1,0],
  ["シャツ","PAL-IDG","春夏","ABC",1,0],
  ["Tシャツ","WHT",[20,99],"C",0,0],
  ["ポロシャツ","WHT",[18,99],"BC",0,0],
  ["ポロシャツ","BLK",[18,99],"BC",0,0],
  ["オープンカラーシャツ","WHT",[22,99],"BC",0,0],
  ["オープンカラーシャツ","BGE",[22,99],"BC",0,0],
  ["メリノタートルネックニット","WHT",[-99,17],"BC",0,1],
  ["メリノタートルネックニット","BLK",[-99,17],"BC",0,1],
  ["メリノタートルネックニット","GRY",[-99,17],"BC",0,1],
  ["メリノクルーネックニット","GRY",[5,20],"BC",0,0],
  ["メリノクルーネックニット","CML",[5,20],"BC",0,0],
  ["スフレヤーンハーフジップハイネックニット","OFF-WHT",[-99,12],"C",0,1,1],
  ["スフレヤーンハイネックカーディガン","BRW",[-99,12],"BC",0,1,1],
  ["スウェット","LGT-GRY",[8,21],"C",0,0],
  ["スウェット","DRK-GRY",[8,21],"C",0,0] ];
const TIES = [ // 名前, 色, 範囲
  ["ネクタイ","GRN",[-99,18]],
  ["ネクタイ","GRN-GEO",[-99,99]],
  ["ネクタイ","BRW",[-99,99]],
  ["ネクタイ","BRW/NVY-STR",[-99,99]],
  ["ニットタイ","NVY","春秋"],
  ["ニットタイ","BRW","春秋"] ];
const SHOES = [ // 名前, 色, 範囲, 対象, 合わせないジャケット色, 雨NG, ソックス群
  ["レザーシューズ","BLK",[-99,99],"AB","brown",0,"k"],
  ["レザーシューズ","BRW",[-99,99],"AB","black",0,"b"],
  ["スニーカー","WHT/GRN",[-99,99],"C","",1,"g"],
  ["スニーカー","BLK",[-99,99],"C","brown",0,"k"],
  ["スニーカー","BGE",[-99,99],"C","",1,"l"],
  ["スリッポン","WHT",[18,99],"BC","",1,"l"],
  ["スリッポン","BLK",[18,99],"BC","brown",0,"k"] ];
const SOCKS = {
  k:["BLK","GRY","NVY","BLK/GRY-CHK","NVY/GRY-CHK"],
  b:["BRW","GRN","NVY","NVY/GRY-CHK"],
  l:["GRY","LGT-GRY/NVY-CHK"],
  g:["GRN","GRY","LGT-GRY/NVY-CHK"] };
const COATS = [["チェスターコート","CML"], ["ダウンコート","BLK"]];
const PATTERNS = [["A","Formal"],["B","Smart Casual"],["C","Relax Casual"]];

// 日付ごとに変わる乱数(同じ日は同じ提案になる)
function rng(seed) {
  let a = 1; for (const ch of seed) a = (a * 31 + ch.charCodeAt(0)) >>> 0;
  const f = () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 5; i++) f();
  return f;
}

let TARGET_DATE = null; // 表示する日(YYYY-MM-DD)
// 戻り値: [表示名, 色コード, 役割, 補足...]
function compose(k, feel, rain) {
  const r = rng((TARGET_DATE || new Date().toLocaleDateString("sv-SE")) + k);
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const ok = (x) => { const [lo, hi] = rg(x); return feel >= lo && feel <= hi; };
  const out = [];
  let tone, stone, set = false;
  const suit = k === "A" && feel <= 17 && r() < 0.5;
  const noJk = !suit && k !== "A" && feel <= SEASON["冬"][1] && r() < 0.45; // 寒い日はジャケットの代わりに厚手ニット
  // コートは冬(体感12℃以下)のみ。チェスターコート(BGE)はカシミヤのため冬限定
  if (feel <= SEASON["冬"][1]) { const c = (feel < 5 || (k === "C" && feel < 10)) ? COATS[1] : COATS[0]; out.push([d(c[0], c[1]), c[1], "coat"]); }
  if (suit) { tone = stone = "brown"; set = true; out.push([d(SUIT[0], SUIT[1]), SUIT[1], "set", 0]); }
  else if (noJk) {
    const kn = pick(TOPS.filter(x => x[6] && x[3].includes(k) && ok(x)));
    tone = stone = /BRW/.test(kn[1]) ? "brown" : "none";
    out.push([d(kn[0], kn[1]), kn[1], "top", kn[5]]);
    if (k === "B" && r() < 0.6) { const kt = pick(TIES.filter(x => x[0] === "ニットタイ")); out.push([d(kt[0], kt[1]), kt[1], "tie"]); } // 厚手ニット+ニットタイ(きれいめ)
  }
  else {
    let cands = JACKETS.filter(ok).map(x => ({ n: d(x[0], x[1]), c: x[1], t: x[3] }))
      .concat(SETUPS.filter(ok).map(x => ({ n: d(x[0] + "・ジャケット", x[1]), c: x[1], t: x[3], s: x })));
    if (!cands.length) cands = JACKETS.map(x => ({ n: d(x[0], x[1]), c: x[1], t: x[3] })); // 着られる季節外でも手持ちから選ぶ
    const j = pick(cands); tone = j.t; stone = tone;
    if (j.s && r() < 0.6) { set = true; out.push([d(j.s[0], j.s[1]), j.s[1], "set", j.s[4]]); }
    else out.push([j.n, j.c, "jacket"]);
  }
  if (!noJk) {
    const top = pick(TOPS.filter(x => x[3].includes(k) && ok(x) && (k !== "A" || x[4]) && !x[6])); // 厚手(x[6])はジャケットと合わせない
    out.push([d(top[0], top[1]), top[1], "top", top[5]]);
  }
  if (k === "A" && feel < SUMMER) { const t = pick(TIES.filter(ok)); out.push([d(t[0], t[1]), t[1], "tie"]); }
  if (!set) { const p = pick(PANTS.filter(x => x[3].includes(k) && ok(x) && !x[4].includes(tone))); out.push([d(p[0], p[1]), p[1], "pants", p[5]]); if (p[1] === "BLK") stone = "black"; else if (p[1].includes("BRW")) stone = "brown"; }
  const sOk = (x, nr) => x[3].includes(k) && ok(x) && !x[4].includes(stone) && !(nr && x[5]);
  let pool = SHOES.filter(x => sOk(x, rain >= 50));
  if (!pool.length) pool = SHOES.filter(x => sOk(x, false));
  const sh = pick(pool);
  const low = /^(スニーカー|スリッポン)/.test(sh[0]) && r() < 0.4; // ショートソックスは見えない前提
  const so = low ? null : pick(SOCKS[sh[6]]);
  out.push(low ? ["ショートソックス", null, "socks"] : [d("ハイソックス", so), so, "socks"], [d(sh[0], sh[1]), sh[1], "shoes"]);
  return out;
}

// ===== 色(HTMLの色見本 / SVGの塗り) =====
function parseColor(code) {
  const chk = code.endsWith("-CHK"), str = code.endsWith("-STR"), geo = code.endsWith("-GEO");
  const base = (chk || str || geo) ? code.slice(0, -4) : code;
  return { cs: base.split("/").map(x => P[x]), chk, str, geo };
}
function cssOf(code, grid) {
  const { cs, chk, str, geo } = parseColor(code);
  if (geo) return "radial-gradient(circle,#f7f7f5 1px,transparent 1.4px) 0 0/5px 5px," + cs[0];
  if (cs.length === 1) return cs[0];
  if (chk && grid) return "linear-gradient(90deg," + cs[1] + " 1px,transparent 1px) 0 0/7px 7px,linear-gradient(" + cs[1] + " 1px,transparent 1px) 0 0/7px 7px," + cs[0];
  if (chk) return "repeating-conic-gradient(" + cs[0] + " 0 25%," + cs[1] + " 0 50%) 0 0/8px 8px";
  if (str) return "repeating-linear-gradient(90deg," + cs[0] + " 0 3px," + cs[1] + " 3px 6px)";
  return "linear-gradient(90deg," + cs[0] + " 50%," + cs[1] + " 50%)";
}
let uid = 0;
function fillOf(code, defs, grid) {
  const { cs, chk, str, geo } = parseColor(code);
  if (cs.length === 1 && !geo) return cs[0];
  const id = "f" + (uid++);
  if (geo) defs.push('<pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="' + cs[0] + '"/><circle cx="2.5" cy="2.5" r="1" fill="#f7f7f5"/></pattern>');
  else if (chk && grid) defs.push('<pattern id="' + id + '" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="' + cs[0] + '"/><path d="M0 0H12M0 0V12" stroke="' + cs[1] + '" stroke-width="1.1" opacity=".9" fill="none"/><path d="M6 0V12M0 6H12" stroke="' + cs[1] + '" stroke-width=".4" opacity=".5" fill="none"/></pattern>');
  else if (chk) defs.push('<pattern id="' + id + '" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="' + cs[0] + '"/><rect width="4" height="4" fill="' + cs[1] + '"/><rect x="4" y="4" width="4" height="4" fill="' + cs[1] + '"/></pattern>');
  else if (str) defs.push('<pattern id="' + id + '" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="' + cs[0] + '"/><rect width="3" height="6" fill="' + cs[1] + '"/></pattern>');
  else defs.push('<linearGradient id="' + id + '"><stop offset="50%" stop-color="' + cs[0] + '"/><stop offset="50%" stop-color="' + cs[1] + '"/></linearGradient>');
  return "url(#" + id + ")";
}

// ===== コーディネートのイラスト(アイテムごとに並べる: ジャケット/シャツ/ネクタイ/パンツ/靴) =====
function figure(o) {
  const g = (role) => o.find(x => x[2] === role);
  const defs = [], F = (c) => fillOf(c, defs), FG = (c) => fillOf(c, defs, true);
  const gid = "sd" + (uid++);
  defs.push('<linearGradient id="' + gid + '" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>');
  const SD = "url(#" + gid + ")";
  const set = g("set"), jk = g("jacket"), cp = g("pants"), top = g("top"), tie = g("tie"), coat = g("coat"), so = g("socks"), sh = g("shoes");
  const hasJ = !!(set || jk), jc = hasJ ? F((set || jk)[1]) : null, pc = FG(set ? set[1] : cp[1]), tc = F(top[1]);
  const PE = (set ? set[3] : cp[3]) ? 198 : 214;
  const suit = !!set && set[0].startsWith("スリーピース");
  const sneaker = /スニーカー/.test(sh[0]), slip = /スリッポン/.test(sh[0]);
  const lite = "rgba(255,255,255,.14)", dk = "rgba(0,0,0,.25)", lining = "rgba(0,0,0,.4)";
  const sym = (p) => p + '<g transform="translate(140 0) scale(-1 1)">' + p + '</g>';
  const body = (dd, fill) => sym('<path d="' + dd + '" fill="' + fill + '"/><path d="' + dd + '" fill="' + SD + '" stroke="none"/>');
  const sleeve = (dd, fill, rot, px, py, mirror, cf) =>
    '<g transform="' + (mirror ? 'translate(140 0) scale(-1 1) ' : '') + 'rotate(' + rot + ' ' + px + ' ' + py + ')"><path d="' + dd + '" fill="' + fill + '"/><path d="' + dd + '" fill="' + SD + '" stroke="none"/><ellipse cx="' + cf[0] + '" cy="' + cf[1] + '" rx="' + cf[2] + '" ry="1.8" fill="rgba(0,0,0,.3)" stroke="none"/></g>';
  const cap = (x, y, t) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="7.5" font-family="Georgia,\'Times New Roman\',serif" letter-spacing="1.2" style="fill:var(--sub)" stroke="none">' + t + '</text>';

  // ジャケット(単体。中は裏地が見える)
  const jacketFlat = () => {
    const jd = "M42 44C36 46 33 56 32 68L26 120L41 123L46 84Z", cf = [33.5, 121.5, 7.7];
    let j = sleeve(jd, jc, 8, 42, 48, false, cf) + sleeve(jd, jc, 8, 42, 48, true, cf);
    j += '<path d="M58 38Q70 31 82 38L82 46L58 46Z" fill="' + jc + '"/><path d="M58 38Q70 31 82 38L82 46L58 46Z" fill="' + dk + '" stroke="none"/>';
    j += '<path d="M60 38L80 38L70 108Z" fill="' + jc + '"/>';
    if (suit) j += '<path d="M62 52L70 106L78 52L78 132L62 132Z" fill="' + jc + '"/><path d="M62 52L70 106L78 52L78 132L62 132Z" fill="rgba(0,0,0,.12)" stroke="none"/><circle cx="70" cy="76" r="1.3" fill="rgba(0,0,0,.45)" stroke="none"/><circle cx="70" cy="92" r="1.3" fill="rgba(0,0,0,.45)" stroke="none"/><circle cx="70" cy="108" r="1.3" fill="rgba(0,0,0,.45)" stroke="none"/>';
    else j += '<path d="M60 38L80 38L70 108Z" fill="' + lining + '" stroke="none"/>';
    j += body("M40 46Q46 39 58 38L63 38L70 106L70 150L42 150Q40 124 43 98Z", jc);
    j += sym('<path d="M58 38.5L63 38L70 106L53 68L56 52Z" fill="' + lite + '"/><path d="M46 126L60 125L60.5 134L46.5 135Z" fill="rgba(0,0,0,.1)"/>');
    j += '<circle cx="67.2" cy="116" r="1.3" fill="rgba(0,0,0,.45)" stroke="none"/>';
    return j;
  };
  // コート(単体)
  const coatFlat = () => {
    const c = F(coat[1]), down = coat[0].startsWith("ダウン"), hem = down ? 196 : 226, hx = down ? 34 : 38;
    const cd = "M37 44C30 46 26 58 25 70L19 " + (down ? 124 : 128) + "L38 " + (down ? 127 : 131) + "L42 86Z", ccf = [28.5, down ? 125.5 : 129.5, 9.5];
    let k = sleeve(cd, c, 8, 38, 48, false, ccf) + sleeve(cd, c, 8, 38, 48, true, ccf);
    k += '<path d="M62 37L78 37L70 ' + (down ? 100 : 92) + 'Z" fill="' + c + '"/><path d="M62 37L78 37L70 ' + (down ? 100 : 92) + 'Z" fill="' + lining + '" stroke="none"/>';
    k += body("M36 46Q44 38 58 37L63 37L70 " + (down ? 100 : 92) + "L70 " + hem + "L" + hx + " " + hem + "Q" + (hx - 1) + " 150 38 100Z", c);
    if (down) {
      k += '<rect x="56" y="29" width="28" height="13" rx="6.5" fill="' + c + '"/><ellipse cx="70" cy="31" rx="9" ry="2" fill="rgba(0,0,0,.35)" stroke="none"/>';
      [70, 95, 120, 145, 170].forEach(y => { k += sym('<path d="M40 ' + y + 'Q55 ' + (y + 4) + ' 70 ' + y + '" fill="none" stroke="rgba(255,255,255,.18)"/>'); });
    } else {
      k += sym('<path d="M57 38L63 37L70 92L50 62L54 48Z" fill="' + lite + '"/>');
      [112, 142, 172].forEach(y => { k += '<circle cx="67" cy="' + y + '" r="1.5" fill="rgba(0,0,0,.45)" stroke="none"/>'; });
    }
    return { svg: k, hem: hem };
  };
  // トップス(たたんだ形)
  const n = top[0];
  const kind = /ハーフジップ/.test(n) ? "zip" : /カーディガン/.test(n) ? "card" : /タートル/.test(n) ? "turtle" : /Tシャツ|クルー|スウェット/.test(n) ? "crew" : /ポロ/.test(n) ? "polo" : "shirt";
  const topLabel = { zip: "KNIT", card: "CARDIGAN", turtle: "KNIT", polo: "POLO", shirt: "SHIRT", crew: /Tシャツ/.test(n) ? "TEE" : /スウェット/.test(n) ? "SWEAT" : "KNIT" }[kind];
  const btn = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="1.3" fill="rgba(255,255,255,.85)" stroke="rgba(0,0,0,.3)"/>';
  const topItem = (x, y) => {
    let r = '<g transform="translate(' + x + ' ' + y + ')">';
    r += '<rect x="0" y="12" width="80" height="80" rx="5" fill="' + tc + '"/><rect x="0" y="12" width="80" height="80" rx="5" fill="' + SD + '" stroke="none"/><path d="M2 62H78" stroke="rgba(0,0,0,.12)" fill="none"/>';
    if (kind !== "shirt" && kind !== "polo") r += '<rect x="0" y="84" width="80" height="8" rx="3" fill="rgba(0,0,0,.14)" stroke="none"/>';
    if (kind === "turtle" || kind === "zip" || kind === "card") {
      r += '<rect x="24" y="0" width="32" height="22" rx="9" fill="' + tc + '"/><ellipse cx="40" cy="3" rx="12" ry="3" fill="rgba(0,0,0,.3)" stroke="none"/>';
      if (kind === "zip") r += '<path d="M40 22V52" stroke="rgba(0,0,0,.4)" fill="none"/><circle cx="40" cy="54" r="2" fill="#b9bcc1"/>';
      if (kind === "card") r += '<path d="M40 22V90" stroke="rgba(0,0,0,.25)" fill="none"/>' + [36, 50, 64, 78].map(yy => btn(40, yy)).join("");
    } else if (kind === "crew") {
      r += '<path d="M24 12Q40 32 56 12" fill="rgba(0,0,0,.28)" stroke="rgba(0,0,0,.3)" stroke-width="3"/>';
    } else {
      const p = kind === "polo" ? 4 : 0;
      r += '<path d="M26 8Q40 3 54 8L54 14L26 14Z" fill="' + tc + '"/><path d="M26 8L40 ' + (34 - p) + 'L22 ' + (38 - p) + 'L14 16Z" fill="' + tc + '"/><path d="M54 8L40 ' + (34 - p) + 'L58 ' + (38 - p) + 'L66 16Z" fill="' + tc + '"/>';
      r += '<path d="M40 ' + (34 - p) + 'V' + (kind === "polo" ? 56 : 92) + '" stroke="rgba(0,0,0,.25)" fill="none"/>';
      r += (kind === "polo" ? [42, 52] : [46, 58, 70, 82]).map(yy => btn(40, yy)).join("");
    }
    return r + '</g>';
  };
  // ネクタイ
  const tieItem = (cx, y) => {
    const t = F(tie[1]), knit = /^ニットタイ/.test(tie[0]);
    const blade = knit ? "M-9 12L9 12L13 108L-13 108Z" : "M-9 12L9 12L14 100L0 114L-14 100Z", knot = "M-7 0L7 0L9 12L-9 12Z";
    return '<g transform="translate(' + cx + ' ' + y + ') rotate(-2)"><path d="' + blade + '" fill="' + t + '"/><path d="' + blade + '" fill="' + SD + '" stroke="none"/><path d="' + knot + '" fill="' + t + '"/><path d="' + knot + '" fill="rgba(0,0,0,.2)" stroke="none"/>' + (knit ? '<path d="M-12 104H12" stroke="rgba(0,0,0,.25)" fill="none"/>' : '') + '</g>';
  };
  // 靴下(ハイソックス)
  const socksItem = (cx, y) => {
    const sk = F(so[1]), sd = "M0 0H18V34Q18 41 25 43Q34 45 34 52Q34 58 26 58H6Q0 58 0 50Z";
    const one = '<path d="' + sd + '" fill="' + sk + '"/><path d="' + sd + '" fill="' + SD + '" stroke="none"/><rect x="0" y="0" width="18" height="7" fill="rgba(0,0,0,.18)" stroke="none"/>';
    return '<g transform="translate(' + (cx - 26) + ' ' + y + ') rotate(-4)">' + one + '<g transform="translate(16 5) rotate(5)">' + one + '</g></g>';
  };
  // 靴(上から見た形)
  const bc = sh[1].split("/"), shoeF = F(bc[0]), acc = bc[1] ? F(bc[1]) : null;
  const outl = "M0 -28C7 -28 10 -18 10.5 -6C11 8 10 22 0 27C-10 22 -11 8 -10.5 -6C-10 -18 -7 -28 0 -28Z";
  const shoe = (x, y, rot) => {
    let r = '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(1.1)">';
    if (sneaker) r += '<path d="' + outl + '" fill="none" stroke="#f2f2ee" stroke-width="3"/>';
    r += '<path d="' + outl + '" fill="' + shoeF + '"/>';
    if (acc) r += '<path d="M-9 14Q0 20 9 14C9 22 5 25 0 26C-5 25 -9 22 -9 14Z" fill="' + acc + '" stroke="none"/>';
    r += slip ? '<ellipse cx="0" cy="6" rx="6.5" ry="14" fill="rgba(0,0,0,.45)" stroke="none"/>' : '<ellipse cx="0" cy="10" rx="5.5" ry="9" fill="rgba(0,0,0,.45)" stroke="none"/>';
    r += '<path d="M-8 -14Q0 -9 8 -14" fill="none" stroke="rgba(0,0,0,.3)"/>';
    if (!slip) r += [-6, -2, 2].map(yy => '<line x1="-5" y1="' + yy + '" x2="5" y2="' + yy + '" stroke="' + (sneaker ? "#f2f2ee" : "rgba(255,255,255,.3)") + '" stroke-width="1.1"/>').join("");
    return r + '</g>';
  };
  // パンツ(縦置き)
  const pd = "M12 14L62 14L66 " + PE + "L38 " + PE + "L37.5 104L36.5 " + PE + "L10 " + PE + "Z";
  const pantsItem = (x, y) => {
    let r = '<g transform="translate(' + x + ' ' + (y - 14) + ')"><path d="' + pd + '" fill="' + pc + '"/><path d="' + pd + '" fill="' + SD + '" stroke="none"/>';
    r += '<path d="M12 14L62 14L62.3 22L11.7 22Z" fill="rgba(0,0,0,.18)"/>';
    r += [22, 37, 52].map(xx => '<rect x="' + (xx - 1.5) + '" y="12.5" width="3" height="11" rx="1" fill="rgba(0,0,0,.22)" stroke="none"/>').join("");
    r += '<path d="M37 22L37 52Q37 58 33 60M13 24Q25 38 21 58M61 24Q49 38 53 58" fill="none" stroke="rgba(0,0,0,.26)"/>';
    r += '<line x1="23" y1="64" x2="22" y2="' + (PE - 6) + '" stroke="rgba(0,0,0,.14)"/><line x1="51" y1="64" x2="52" y2="' + (PE - 6) + '" stroke="rgba(0,0,0,.14)"/></g>';
    return r;
  };

  // ===== レイアウト(名前は各アイテムの下に表示) =====
  let y = 12, s = '<g stroke="rgba(0,0,0,.22)" stroke-width=".7" stroke-linejoin="round">';
  const place = (inner, sc, top0, bottom, label, cx) => {
    s += '<g transform="translate(' + (cx - 70 * sc) + ' ' + (y - top0 * sc) + ') scale(' + sc + ')">' + inner + '</g>';
    const yy = y + (bottom - top0) * sc; s += cap(cx, yy + 11, label); return yy + 26;
  };
  const jLabel = set ? (suit ? "SUIT" : "SETUP") : "JACKET";
  if (coat && hasJ) { const c = coatFlat(); y = Math.max(place(c.svg, 0.88, 37, c.hem, "COAT", 62), place(jacketFlat(), 0.9, 30, 150, jLabel, 178)); } // コート左・ジャケット右
  else if (coat) { const c = coatFlat(); y = place(c.svg, 1.15, 37, c.hem, "COAT", 120); }
  else y = place(jacketFlat(), 1.6, 30, 150, jLabel, 120);
  const yc = y;
  s += topItem(8, yc) + cap(48, yc + 104, topLabel);
  let my = yc;
  if (tie) { s += tieItem(118, my) + cap(118, my + 128, "TIE"); my = yc + 142; } else my = yc + 10;
  if (so[1]) { s += socksItem(118, my) + cap(118, my + 68, "SOCKS"); }
  s += shoe(36, yc + 168, -6) + shoe(66, yc + 165, 6) + cap(51, yc + 210, "SHOES");
  s += pantsItem(152, yc) + cap(190, yc + PE, "PANTS") + '</g>';
  const H = yc + 232;
  return '<svg viewBox="0 0 240 ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="コーディネートのイメージ"><defs>' + defs.join("") + '</defs>' + s + '</svg>';
}

// ===== 天気のイラスト =====
const CLD = '<path d="M13 32a7 7 0 0 1 0-14 9 9 0 0 1 17-1.5A6.5 6.5 0 0 1 31 32z" fill="#f4f6f8" stroke="#8a9199" stroke-width="1.5"/>';
const WX = { sun:"晴れ", partly:"晴れ時々くもり", cloud:"くもり", fog:"霧", rain:"雨", snow:"雪", thunder:"雷雨" };
function wxCat(c) {
  if (c <= 1) return "sun"; if (c === 2) return "partly"; if (c === 3) return "cloud";
  if (c === 45 || c === 48) return "fog"; if (c >= 95) return "thunder";
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow"; return "rain";
}
function wxIcon(c) {
  const k = wxCat(c), Y = "#f5b82e", up = '<g transform="translate(0 -3)">' + CLD + '</g>';
  let b = "";
  if (k === "sun") b = '<circle cx="22" cy="22" r="9" fill="' + Y + '"/>' + [0,45,90,135,180,225,270,315].map(a => '<line x1="22" y1="6" x2="22" y2="9" stroke="' + Y + '" stroke-width="2.5" stroke-linecap="round" transform="rotate(' + a + ' 22 22)"/>').join("");
  else if (k === "partly") b = '<circle cx="29" cy="14" r="7" fill="' + Y + '"/><g transform="translate(0 4)">' + CLD + '</g>';
  else if (k === "cloud") b = '<g transform="translate(0 2)">' + CLD + '</g>';
  else if (k === "fog") b = [14,22,30].map((y, i) => '<line x1="' + (8 + i * 3) + '" y1="' + y + '" x2="' + (36 - i * 3) + '" y2="' + y + '" stroke="#9aa1a8" stroke-width="3" stroke-linecap="round"/>').join("");
  else if (k === "rain") b = up + [14,22,30].map(x => '<line x1="' + x + '" y1="32" x2="' + (x - 3) + '" y2="39" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>').join("");
  else if (k === "snow") b = up + [14,22,30].map(x => '<circle cx="' + x + '" cy="36" r="2" fill="#9db4c8"/>').join("");
  else b = up + '<polygon points="23,27 17,37 22,37 20,43 29,32 23,32" fill="' + Y + '"/>';
  return '<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + b + '</svg>';
}

// 5時と23時にページを更新する(開いたままでも切り替わる)
const slotOf = (t) => t.toDateString() + (t.getHours() >= 23 ? "n" : t.getHours() >= 5 ? "d" : "e");
const SLOT = slotOf(new Date());
function scheduleRefresh() {
  const n = new Date();
  const next = [5, 23].map(h => { const x = new Date(n); x.setHours(h, 0, 5, 0); if (x <= n) x.setDate(x.getDate() + 1); return x; }).sort((a, b) => a - b)[0];
  setTimeout(() => location.reload(), next - n);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && slotOf(new Date()) !== SLOT) location.reload(); });
}

const avg = (a) => a.reduce((s, v) => s + v, 0) / a.length;

async function main() {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code" +
    "&timezone=Asia%2FTokyo&forecast_days=2";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const d = (await res.json()).hourly;

  // 23時以降は翌日の予報、それ以外は当日の予報を使う(更新は5時と23時)
  const now = new Date(), OFF = now.getHours() >= 23 ? 24 : 0;
  const target = new Date(now.getTime() + OFF * 3600000);
  const pad = (n) => String(n).padStart(2, "0");
  TARGET_DATE = target.getFullYear() + "-" + pad(target.getMonth() + 1) + "-" + pad(target.getDate());

  const go = [GO + OFF, GO + 1 + OFF], back = [BACK + OFF, BACK + 1 + OFF];
  const pick = (key, hrs) => avg(hrs.map(h => d[key][h]));
  const tGo = pick("temperature_2m", go), tBack = pick("temperature_2m", back);
  const fGo = pick("apparent_temperature", go), fBack = pick("apparent_temperature", back);
  const rain = Math.max(...[GO, GO + 1, BACK, BACK + 1].map(h => d.precipitation_probability[h + OFF] || 0));

  const wxHtml = '<div class="wx">' + [["行き", d.weather_code[GO + OFF]], ["帰り", d.weather_code[BACK + OFF]]].map(x => '<div>' + wxIcon(x[1]) + '<span>' + x[0] + ' ' + WX[wxCat(x[1])] + '</span></div>').join("") + '</div>';
  // 朝晩の低いほうの体感温度に合わせる
  const feel = Math.min(fGo, fBack);
  const tier = TIERS.find(t => feel >= t.min);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.style.setProperty("--tint", dark ? tier.tint[1] : tier.tint[0]);

  const notes = [];
  if (Math.abs(tGo - tBack) >= 6) notes.push("朝晩の気温差が約" + Math.round(Math.abs(tGo - tBack)) + "℃あります。脱ぎ着しやすい羽織りがあると安心です。");
  if (feel >= 26) notes.push("暑いので、ジャケットは移動中は脱いで持つと快適です。");
  if (rain >= 50) notes.push("通勤時間帯の降水確率は" + rain + "%です。傘と、濡れても平気な靴を。");
  else if (rain >= 30) notes.push("通勤時間帯の降水確率は" + rain + "%です。折りたたみ傘を持っておくと安心です。");

  const r = (n) => Math.round(n);
  const dateStr = target.getFullYear() + "/" + pad(target.getMonth() + 1) + "/" + pad(target.getDate()) + "(" + "日月火水木金土"[target.getDay()] + ")" + (OFF ? ' <small class="sub">明日の予報</small>' : "");
  document.getElementById("app").innerHTML =
    '<div class="date">' + dateStr + '</div><div class="head"><div class="temp">' + r(fGo) + '<small>℃</small></div>' +
    '<div class="meta"><b>' + NAME + '・' + tier.label + '</b><br>' +
    '行き ' + r(tGo) + '℃(体感' + r(fGo) + '℃) / 帰り ' + r(tBack) + '℃(体感' + r(fBack) + '℃)<br>' +
    '降水確率 最大' + rain + '%</div>' + wxHtml + '</div>' +
    notes.map(n => '<div class="alert">' + n + '</div>').join("") +
    '<div class="list">' + PATTERNS.map(p => { const o = compose(p[0], feel, rain); const label = (p[0] === "A" && feel >= SUMMER) ? "Formal (No Tie)" : p[1];
      return '<div class="item"><div class="fig">' + figure(o) + '</div><div><h2>' + label + '</h2><ul class="parts">' +
        o.map(x => '<li><i style="' + (x[1] ? 'background:' + cssOf(x[1], x[2] === "pants" || x[2] === "set") : 'border-style:dashed') + '"></i>' + x[0] + (x[1] ? '' : '(見えない想定)') + '</li>').join("") + '</ul></div></div>'; }).join("") + '</div>' +
    '<div class="foot">' + GO + '時・' + BACK + '時の予報から自動で提案しています(Open-Meteo)。5時と23時に更新します。</div>';
}

main().catch(e => {
  document.getElementById("app").innerHTML =
    '<div class="err">天気を取得できませんでした。ページを再読み込みしてください。(' + e.message + ')</div>';
});
scheduleRefresh();
</script>
</body>
</html>
